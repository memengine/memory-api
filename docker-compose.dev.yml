services:
  postgres-dev:
    image: postgres:15
    environment:
      POSTGRES_DB: memoryos_dev
      POSTGRES_USER: memoryos
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryos -d memoryos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-dev:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  qdrant_dev_data:
