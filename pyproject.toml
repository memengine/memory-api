[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "memoryos"
version = "0.1.0"
requires-python = ">=3.12"
 
dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
 
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
 
    # Qdrant vector database
    "qdrant-client>=1.9.0",
    "grpcio>=1.62.0",
 
    # Redis cache
    "redis[asyncio]>=5.0.0",
 
    # AI / Gemini
    "google-genai>=1.30.0",
    "tiktoken>=0.7.0",
 
    # Background tasks
    "celery>=5.3.0",
    "psutil>=6.0.0",

    # Auth
    "python-jose[cryptography]==3.5.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
 
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
 
    # Monitoring
    "sentry-sdk[fastapi]>=2.10.0",
    "boto3>=1.34.0",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
"api.services" = ["prompts/*.txt"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

# Baseline for the current SQLAlchemy/FastAPI-heavy API surface.
# Keep mypy in CI, but do not block deploys on dynamic ORM/router typing debt.
# Tighten this list module-by-module as files are converted to strict typing.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "truthy-function",
    "no-redef",
    "func-returns-value",
    "call-overload",
    "dict-item",
    "index",
    "list-item",
    "misc",
    "name-defined",
    "no-any-return",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
    "var-annotated",
]