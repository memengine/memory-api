# Local development override.
# Docker Compose loads this automatically for `docker compose ...` commands.
# Keep source/tests bind-mounted so edits are visible without rebuilding the image.

x-api-dev-volumes: &api-dev-volumes
  - ./api:/app/api
  - ./tests:/app/tests
  - ./docs:/app/docs
  - ./sdk:/app/sdk
  - ./scripts:/app/scripts
  - ./alembic.ini:/app/alembic.ini

x-api-dev-environment: &api-dev-environment
  PYTEST_ADDOPTS: "-o cache_dir=/tmp/.pytest_cache"

services:
  api:
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  celery-enterprise:
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  celery-growth:
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  celery-starter:
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  celery-background:
    environment: *api-dev-environment
    volumes: *api-dev-volumes

  celery-beat:
    environment: *api-dev-environment
    volumes: *api-dev-volumes
