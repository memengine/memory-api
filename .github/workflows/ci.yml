name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: memoryos_test
          POSTGRES_USER: memoryos
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U memoryos -d memoryos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Copy extraction spec example
        run: cp docs/extraction_spec.example.md docs/extraction_spec.md

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://memoryos:testpassword@localhost:5432/memoryos_test
          SECRET_KEY: ci-secret-key
          ADMIN_SECRET: test-secret-32-chars-minimum-xx
          OPENAI_API_KEY: test-key-for-unit-tests
          GEMINI_API_KEY: test-key-for-unit-tests
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://memoryos:testpassword@localhost:5432/memoryos_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ADMIN_SECRET: test-secret-32-chars-minimum-xx
          SECRET_KEY: ci-secret-key
          OPENAI_API_KEY: test-key-for-unit-tests
          GEMINI_API_KEY: test-key-for-unit-tests
          LLM_PROVIDER_ORDER: openai,gemini
        run: pytest tests/unit/ -v --tb=short

      - name: Type check
        run: python -m mypy api/ --ignore-missing-imports

  sdk-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: TypeScript SDK typecheck
        run: |
          cd sdk/typescript
          npm ci
          npm run typecheck



