name: Internal benchmark provider evaluation

on:
  workflow_dispatch:
    inputs:
      approve_paid_provider:
        description: "I approve paid provider calls for development datasets only"
        required: true
        type: boolean
        default: false

jobs:
  provider:
    if: inputs.approve_paid_provider == true
    runs-on: ubuntu-latest
    environment: benchmark-provider-approval
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memoryos_test
          POSTGRES_USER: memoryos
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memoryos -d memoryos_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Migrate test database
        env: &provider-env
          DATABASE_URL: postgresql+asyncpg://memoryos:testpassword@localhost:5432/memoryos_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          SECRET_KEY: provider-secret-key
          ADMIN_SECRET: provider-admin-secret-32-chars
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEMORYOS_HOLDOUT_APPROVAL: ""
        run: alembic upgrade head
      - name: Run explicitly approved PROVIDER benchmark tier
        env: *provider-env
        run: python -m benchmarks.internal.orchestrator --tier provider --approve-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-benchmark-provider
          path: artifacts/internal-benchmarks/aggregate/
